name: ci

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: pytest (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    name: pytest (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wolverg
          POSTGRES_PASSWORD: wolverg
          POSTGRES_DB: wolverg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolverg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://wolverg:wolverg@localhost:5432/wolverg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q